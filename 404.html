<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Page Not Found</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .nav-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .fa-triangle-exclamation {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="container">
            <div class="left-component">
                <a href="index.html"><img src="images/logo.webp" alt="ASU | Anki flashcards" /></a>
            </div>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="ver-devider"></div>
                <a href="index.html" class="main-btn">
                    Go Home <i class="fa-solid fa-house fa-fw"></i>
                </a>
            </div>
        </div>
    </nav>

    <main style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
        <div class="container" style="text-align: center;">
            <div class="error-content">
                <i class="fa-solid fa-triangle-exclamation"
                    style="font-size: 80px; color: var(--main-color); margin-bottom: 20px; opacity: 0.8;"></i>
                <h1 style="font-size: 80px; margin: 0; line-height: 1; color: var(--text-color);">404</h1>
                <h2 style="margin: 10px 0 20px; font-weight: 500;">Page Not Found</h2>
                <p style="color: var(--text-secondary-color); max-width: 500px; margin: 0 auto 30px;">
                    Oops! The page you are looking for might have been removed, had its name changed, or is temporarily
                    unavailable.
                </p>
                <a href="index.html" class="main-btn" style="display: inline-flex;">
                    Back to Home <i class="fa-solid fa-arrow-right fa-fw"></i>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 ASU Anki Flashcards.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
</body>

</html>
