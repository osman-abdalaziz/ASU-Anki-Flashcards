<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creators | My Decks</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
        body {
            display: flex !important;
        }

        .table-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            color: var(--text-color);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-approved {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .banner-thumb {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--ver-tag-color);
        }

        .modal-overlay {
            opacity: 1;
        }
    </style>
</head>

<body>
    <main class="dashboard-container">
        <aside>
            <div class="admin-logo">
                <a href="../index.html"><img src="../images/logo.webp" alt="ASU Anki" /></a>
            </div>
            <ul class="admin-nav">
                <li><a href="index.html" class="active"><i class="fa-solid fa-layer-group fa-fw"></i> My Decks</a>
                <li><a href="submit_deck.html"><i class="fa-solid fa-cloud-arrow-up fa-fw"></i> Submit Deck</a></li>
                </li>
            </ul>
        </aside>

        <section class="dashboard-main">
            <nav>
                <div style="flex:1;"></div>
                <div class="nav-actions" style="display: flex; align-items: center;">
                    <div class="userProfile-header">
                        <div class="userimg"><img id="mobileUserAvatar" src="../images/user.webp" alt="User" /></div>
                        <p id="mobileUserName" style="padding: 10px 15px; font-weight: 400; margin: 0;">Creator</p>
                    </div>
                </div>
            </nav>

            <div class="dashboard-content">
                <div class="container">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h1 class="dashboard-title">My <span>Uploaded Decks</span></h1>
                        <a href="submit_deck.html" class="main-btn"
                            style="text-decoration: none; padding: 10px 20px; font-size: 0.9rem;">Add New <i
                                class="fa-solid fa-plus"></i></a>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Banner</th>
                                    <th>Deck Details</th>
                                    <th>Type</th>
                                    <th>Version</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="myDecksTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center;">Loading your decks...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <footer>
                <div class="container">
                    <p>&copy; 2026 ASU Anki Flashcards.</p>
                </div>
            </footer>
        </section>
    </main>
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon"><i id="modalIconClass" class="fa-solid fa-check"></i></div>
            <h3 id="modalTitle">Title</h3>
            <p id="modalMessage">Message.</p>
            <div class="modal-actions" style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="modalOkBtn" class="main-btn" style="width: auto; min-width: 100px;">OK</button>
            </div>
        </div>
    </div>
    <script type="module" src="../js/my_decks.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>

</html>
