<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Decks Management</title>
    <!-- Website Favicon -->
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://www.googleapis.com">
</head>

<body>
    <main class="dashboard-container">
        <aside>
            <div class="admin-logo">
                <a href="../index.html"><img src="../images/logo.webp" alt="" /></a>
            </div>
            <ul class="admin-nav">
                <li><a href="index.html"><i class="fa-solid fa-chart-line fa-fw"></i> Dashboard</a></li>
                <li>
                    <a id="decksDropbtn" href="#" class="active decksDropar"><i class="fa-solid fa-angle-up fa-fw"></i>
                        Decks Management
                    </a>
                </li>
                <div id="decksDrop" class="decksDrop active">
                    <a href="add_decks.html" class="active"><i class="fa-solid fa-plus fa-fw"></i> Add New Deck</a>
                    <a href="manage_decks.html" class=""><i class="fa-solid fa-box fa-fw"></i> Decks
                        Table</a>
                    <a href="reviews.html"><i class="fa-solid fa-star fa-fw"></i> Reviews & Ratings</a>
                    <a href="reports.html"><i class="fa-solid fa-flag fa-fw"></i> Reports & Issues</a>
                </div>

                <li>
                    <a id="notiDropbtn" href="#" class="notiDropar"><i class="fa-solid fa-angle-down fa-fw"></i>
                        Notification Manage
                    </a>
                </li>
                <div id="notiDrop" class="decksDrop">
                    <a href="notifications.html"><i class="fa-solid fa-plus fa-fw"></i> Add
                        Notifications</a>
                    <a href="manage_notifications.html" class=""><i class="fa-solid fa-box fa-fw"></i> Notifications
                        Table</a>
                </div>


            </ul>
        </aside>
        <section class="dashboard-main">
            <nav>
                <div class="search" disabled style="opacity:0;">
                    <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                    <input type="text" id="searchInput" placeholder="Search..." />
                </div>

                <div class="nav-actions">
                    <div class="userProfile-header">
                        <div class="userimg">
                            <img id="mobileUserAvatar" src="" alt="User" />
                        </div>
                        <p id="mobileUserName" style="
                                    padding: 10px 15px;
                                    font-weight: 400;
                                    margin: 0;
                                ">
                            User Name
                        </p>
                    </div>
            </nav>

            <div class="dashboard-content">
                <div class="container">
                    <h1 class="dashboard-title">Add New <span>Deck</span></h1>

                    <form action="" class="decks-form">
                        <div class="col">
                            <label class="field">
                                <span class="field-label">Title</span>
                                <div class="input-wrap">
                                    <input type="text" name="title" placeholder="Enter Deck Title" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Description</span>
                                <div class="input-wrap">
                                    <input type="text" name="description" placeholder="Enter Deck Description" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Module</span>
                                <div class="input-wrap">
                                    <input type="text" name="module" placeholder="Enter Deck Module" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Creator</span>
                                <div class="input-wrap">
                                    <input type="text" name="creator" placeholder="Enter Deck Creator" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Download URL</span>
                                <div class="input-wrap">
                                    <input type="url" name="downloadUrl" placeholder="Enter Deck Download URL" />
                                </div>
                            </label>
                        </div>
                        <div class="col">
                            <label class="field">
                                <span class="field-label">Thumbnail URL</span>
                                <div class="input-wrap">
                                    <input type="url" name="thumbnailUrl" placeholder="Enter Deck Thumbnail URL" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Year</span>
                                <div class="filters">
                                    <select name="year" id="">
                                        <option value="1st Year">1st Year</option>
                                        <option value="2nd Year">2nd Year</option>
                                        <option value="3rd Year">3rd Year</option>
                                        <option value="4th Year">4th Year</option>
                                        <option value="5th Year">5th Year</option>
                                    </select>
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Category</span>
                                <div class="filters">
                                    <select name="category" id="">
                                        <option value="practical">Practical</option>
                                        <option value="theoretical">Theoretical</option>
                                    </select>
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Version</span>
                                <div class="input-wrap">
                                    <input type="text" name="version" placeholder="Enter Deck Version" />
                                </div>
                            </label>
                            <label class="field">
                                <span class="field-label">Last Updated</span>
                                <div class="input-wrap">
                                    <input type="date" name="lastUpdated" placeholder="Enter Deck Last Updated" />
                                </div>
                            </label>

                        </div>


                    </form>
                    <button class="main-btn submit-deck" type="submit">
                        Add Deck <i class="fa-solid fa-plus fa-fw"></i></button>
                </div>
            </div>

            <footer>
                <div class="container">
                    <p>&copy; 2025 ASU Anki Flashcards. All rights reserved.</p>
                    <p>
                        Made With <i class="fa-solid fa-heart fa-fw"></i> By
                        <a href="https://osmanabdalaziz-portfolio.netlify.app/" target="_blank"><img
                                src="../images/mylogo_white.webp" alt="" /></a>
                    </p>
                </div>
            </footer>
        </section>
    </main>
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon"><i id="modalIconClass" class="fa-solid fa-check"></i></div>
            <h3 id="modalTitle">Title</h3>
            <p id="modalMessage">Message goes here.</p>

            <div class="modal-actions" style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="modalCancelBtn" class="action-btn"
                    style="background: transparent; border: 1px solid var(--text-color); color: var(--text-color); display: none;">Cancel</button>
                <button id="modalOkBtn" class="main-btn" style="width: auto; min-width: 100px;">OK</button>
            </div>
        </div>
    </div>
    <script type="module" src="../js/admin.js"></script>
    <script type="module" src="../js/main.js"></script>
    <!-- <script type="module" src="../js/theme.js"></script> -->
</body>

</html>
