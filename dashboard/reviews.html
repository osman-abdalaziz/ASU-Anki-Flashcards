<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Reviews Management</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
    <main class="dashboard-container">
        <aside>
            <div class="admin-logo">
                <a href="../index.html"><img src="../images/logo.png" alt="" /></a>
            </div>
            <ul class="admin-nav">
                <li>
                    <a id="decksDropbtn" href="#" class="decksDropar"><i class="fa-solid fa-angle-down fa-fw"></i>
                        Decks Management
                    </a>
                </li>
                <div id="decksDrop" class="decksDrop active">
                    <a href="index.html"><i class="fa-solid fa-plus fa-fw"></i> Add New Deck</a>
                    <a href="manage_decks.html"><i class="fa-solid fa-box fa-fw"></i> Decks Table</a>
                    <a href="reviews.html" class="active"><i class="fa-solid fa-star fa-fw "></i> Reviews & Ratings</a>
                </div>



                <li>
                    <a id="notiDropbtn" href="#" class="notiDropar"><i class="fa-solid fa-angle-down fa-fw"></i>
                        Notification Manage
                    </a>
                </li>
                <div id="notiDrop" class="decksDrop">
                    <a href="notifications.html"><i class="fa-solid fa-plus fa-fw"></i> Add Notifications</a>
                    <a href="manage_notifications.html"><i class="fa-solid fa-box fa-fw"></i> Notifications Table</a>
                </div>
            </ul>
        </aside>

        <section class="dashboard-main">
            <nav>
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                    <input type="text" id="searchInput" placeholder="Search reviews..." />
                </div>
                <div class="nav-actions">
                    <div class="userProfile-header">
                        <div class="userimg">
                            <img id="mobileUserAvatar" src="" alt="User" />
                        </div>
                        <p id="mobileUserName" style="padding: 10px 15px; font-weight: 400; margin: 0;">Admin</p>
                    </div>
                </div>
            </nav>

            <div class="dashboard-content">
                <div class="container">
                    <h1 class="dashboard-title">Reviews <span>Management</span></h1>

                    <div class="search" style="max-width: 100% !important; margin-bottom: 20px;">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchReviewsInput"
                            placeholder="Search by deck name, user, or comment...">
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Deck Title</th>
                                    <th>User Name</th>
                                    <th>Rating</th>
                                    <th>Comment</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reviewsTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <footer>
                <div class="container">
                    <p>&copy; 2025 ASU Anki Flashcards.</p>
                </div>
            </footer>
        </section>
    </main>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon"><i id="modalIconClass" class="fa-solid fa-check"></i></div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Operation completed.</p>
            <button id="modalOkBtn">OK</button>
        </div>
    </div>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/manage_reviews.js"></script>
</body>

</html>
